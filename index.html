<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="JM Palau Alegria" />
    <meta name="theme-color" content="#140453" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved / system theme before first paint to avoid a flash of the wrong theme -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <!-- Title, description, Open Graph and JSON-LD are set per page via <Seo /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
